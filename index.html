<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ถึง...พี่แพรว 🌙 (จากฟลุ๊ค)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #050510;
            color: #f3f4f6;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .text-glow {
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.6), 0 0 24px rgba(236, 72, 153, 0.4);
        }

        .moon-glow {
            box-shadow: 0 0 40px rgba(254, 240, 138, 0.35), 0 0 80px rgba(254, 240, 138, 0.15);
        }

        .btn-glow {
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-glow:active {
            transform: scale(0.95);
        }

        .fade-enter {
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 1s ease-out, transform 1s ease-out;
        }
        .fade-enter-active {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(3deg); }
        }
        .floating {
            animation: float 5s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen w-full relative overflow-hidden flex flex-col justify-between select-none">

    <!-- Audio Synth Control -->
    <button id="soundToggle" class="fixed top-4 right-4 z-50 glass-panel p-2.5 rounded-full text-xs text-gray-300 flex items-center gap-2 border border-white/10 active:scale-95 transition-transform">
        <span id="soundIcon">🔇</span> <span id="soundText" class="hidden sm:inline">เปิดเสียงบรรยากาศ</span>
    </button>

    <!-- Background Canvas -->
    <canvas id="bgCanvas" class="fixed inset-0 w-full h-full z-0 pointer-events-none"></canvas>

    <!-- Main Content Container -->
    <main class="relative z-10 w-full min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 text-center">
        
        <!-- Chapter Container -->
        <div id="contentBox" class="w-full max-w-lg glass-panel rounded-3xl p-6 sm:p-8 my-auto transition-all duration-700">
            
            <!-- Opening Scene -->
            <div id="scene-opening" class="scene space-y-6">
                <div class="relative inline-block cursor-pointer" id="moonContainer" title="ลองกดที่พระจันทร์สิ...">
                    <div id="moonEl" class="w-24 h-24 sm:w-28 sm:h-28 rounded-full bg-gradient-to-tr from-amber-100 via-amber-200 to-yellow-100 moon-glow mx-auto flex items-center justify-center relative overflow-hidden transition-transform active:scale-90 duration-200 floating">
                        <div class="absolute w-5 h-5 rounded-full bg-amber-300/30 top-3 left-4"></div>
                        <div class="absolute w-8 h-8 rounded-full bg-amber-300/20 bottom-4 right-3"></div>
                    </div>
                    <span id="clickHint" class="absolute -bottom-6 left-1/2 -translate-x-1/2 text-[10px] text-yellow-200/60 whitespace-nowrap opacity-0 transition-opacity">กดที่นี่ 🌙</span>
                </div>

                <div class="space-y-3 min-h-[120px] flex flex-col justify-center">
                    <h1 class="text-2xl sm:text-3xl font-bold text-glow text-white tracking-wide">ถึง...พี่แพรว 🌙</h1>
                    <p id="typewriter-opening" class="text-sm sm:text-base text-gray-300 leading-relaxed min-h-[3rem]"></p>
                </div>

                <div id="startBtnWrapper" class="opacity-0 transition-opacity duration-1000">
                    <button id="startBtn" class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 text-white font-medium text-base btn-glow hover:brightness-110 active:scale-95 transition-all">
                        ✨ เริ่มต้น
                    </button>
                </div>
            </div>

            <!-- Chapter Story Scenes -->
            <div id="scene-story" class="scene hidden space-y-6">
                <div id="chapterBadge" class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-pink-500/20 text-pink-300 border border-pink-500/30">
                    บทที่ 1
                </div>
                
                <div class="min-h-[160px] flex items-center justify-center p-2">
                    <p id="typewriter-story" class="text-base sm:text-lg text-gray-200 leading-relaxed font-light text-glow"></p>
                </div>

                <button id="nextBtn" class="w-full py-3 px-6 rounded-2xl glass-panel text-white font-medium text-sm border border-white/20 hover:bg-white/10 active:scale-95 transition-all hidden">
                    ถัดไป ➔
                </button>
            </div>

            <!-- Final Question Scene -->
            <div id="scene-final" class="scene hidden space-y-6">
                <div id="finalBadge" class="inline-block px-4 py-1.5 rounded-full text-xs font-semibold bg-rose-500/20 text-rose-300 border border-rose-500/30 animate-pulse">
                    ความในใจของฟลุ๊ค
                </div>

                <div class="space-y-2">
                    <h2 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-300 via-purple-200 to-indigo-200 text-glow">พี่แพรว ❤️</h2>
                    <p class="text-xl font-medium text-white text-glow">ฟลุ๊ครักพี่แพรวนะ</p>
                </div>

                <div class="pt-4 space-y-3">
                    <p id="finalQuestion" class="text-base text-gray-300 font-light opacity-0 transition-opacity duration-1000">เป็นแฟนกันมั้ย</p>
                    
                    <div id="choiceBtns" class="grid grid-cols-1 sm:grid-cols-2 gap-3 opacity-0 transition-opacity duration-1000 pt-2">
                        <button id="yesBtn" class="py-3.5 px-4 rounded-2xl bg-gradient-to-r from-pink-500 to-rose-500 text-white font-semibold text-sm btn-glow hover:brightness-110 active:scale-95 transition-all">
                            💖 ได้สิ
                        </button>
                        <button id="noBtn" class="py-3.5 px-4 rounded-2xl glass-panel text-gray-300 font-medium text-sm hover:bg-white/10 active:scale-95 transition-all border border-white/10">
                            🤍 ขอคิดดูก่อน
                        </button>
                    </div>
                </div>
            </div>

            <!-- Answer Result Scene -->
            <div id="scene-result" class="scene hidden space-y-6">
                <div id="resultTextContainer" class="space-y-4 min-h-[160px] flex flex-col justify-center">
                    <p id="typewriter-result" class="text-base sm:text-lg text-gray-100 leading-relaxed font-light text-glow"></p>
                </div>

                <div id="afterResultBtns" class="space-y-3 opacity-0 transition-opacity duration-1000 pt-4">
                    <button id="restartBtn" class="w-full py-3 px-4 rounded-2xl glass-panel text-gray-300 text-xs font-medium border border-white/10 hover:bg-white/10 active:scale-95 transition-all">
                        🌙 กลับไปดูดาวอีกครั้ง
                    </button>
                </div>
            </div>

            <!-- Secret Easter Egg Box -->
            <div id="secretBox" class="hidden mt-6 p-4 rounded-2xl bg-amber-500/10 border border-amber-400/30 text-left space-y-2 animate-fade-in">
                <div class="flex items-center gap-2 text-amber-300 text-xs font-semibold">
                    <span>🌙</span> <span>ความลับที่ซ่อนอยู่...</span>
                </div>
                <p class="text-xs sm:text-sm text-amber-100/90 leading-relaxed font-light">
                    จริง ๆ แล้ว ฟลุ๊คแอบยิ้มทุกครั้งเวลาพี่ทักมา และหวังเสมอว่าจะได้คุยกับพี่อีก 😊❤️
                </p>
            </div>

        </div>

        <footer class="mt-auto pt-6 text-[11px] text-gray-500/60 font-light">
            สร้างขึ้นด้วยความตั้งใจ โดย ฟลุ๊ค ✨
        </footer>
    </main>

    <script>
        // ==========================================
        // ⚙️ ตั้งค่า TELEGRAM BOT ของคุณฟลุ๊ค
        // ==========================================
        const TELEGRAM_BOT_TOKEN = '8806962043:AAFlXfRmsOeSZdGW14XLyK1iL4uyPAwEbqQ';
        const TELEGRAM_CHAT_ID = '8800818527';

        // ฟังก์ชันส่งการแจ้งเตือนเข้า Telegram บนมือถือ
        async function sendTelegramNotification(choiceText) {
            if (!TELEGRAM_BOT_TOKEN || TELEGRAM_BOT_TOKEN.includes('ใส่_BOT_TOKEN')) {
                console.log('ยังไม่ได้ใส่ Bot Token');
                return;
            }

            const timeString = new Date().toLocaleString('th-TH', { timeZone: 'Asia/Bangkok' });
            const message = `🎉 **มีคำตอบจากเว็บพี่แพรว!**\n\nพี่แพรวกดตอบว่า: "${choiceText}" ❤️\nเวลา: ${timeString}`;

            try {
                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });
            } catch (err) {
                console.error('Telegram notification failed:', err);
            }
        }

        // ==========================================
        // Script Data & Audio Synth Logic
        // ==========================================
        const chapters = [
            {
                badge: "บทที่ 1",
                bgMode: "stars",
                text: "ฟลุ๊คไม่รู้ว่า พี่จะรู้สึกยังไงกับเว็บนี้\nแต่ทุกตัวอักษร ฟลุ๊คตั้งใจเขียนมันทั้งหมด\nด้วยความรู้สึกจริง ๆ"
            },
            {
                badge: "บทที่ 2",
                bgMode: "sea",
                text: "ตั้งแต่ได้รู้จักพี่ วันธรรมดา ๆ กลับกลายเป็นวันที่น่ารอ\nเพราะแค่ได้คุยกับพี่แพรว\nฟลุ๊คก็ยิ้มได้แล้ว 😊"
            },
            {
                badge: "บทที่ 3",
                bgMode: "hearts",
                text: "ฟลุ๊คไม่รู้ตัวด้วยซ้ำว่า ความรู้สึกนี้เริ่มต้นเมื่อไหร่\nแต่รู้ตัวอีกที...\nฟลุ๊คก็ชอบพี่ไปแล้ว ❤️"
            },
            {
                badge: "บทที่ 4",
                bgMode: "petals",
                text: "ฟลุ๊ครู้ดี ว่าความรู้สึกเป็นสิ่งที่บังคับกันไม่ได้\nเพราะแบบนั้น เว็บนี้ไม่ได้ถูกสร้างขึ้นเพื่อกดดันพี่แพรว\nแต่ถูกสร้างขึ้น เพื่อบอกความจริง"
            },
            {
                badge: "บทที่ 5",
                bgMode: "meteors",
                text: "ขอบคุณนะ ที่เข้ามาอ่านจนถึงตรงนี้\nแค่นั้น... ฟลุ๊คก็ดีใจมากแล้ว"
            }
        ];

        let currentChapter = 0;
        let moonClicks = 0;
        let isAudioPlaying = false;
        let audioCtx = null;
        let windGain = null;

        // Audio Synth
        function initAudio() {
            if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            // Wind Ambient Generator
            const bufferSize = audioCtx.sampleRate * 2;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }

            const whiteNoise = audioCtx.createBufferSource();
            whiteNoise.buffer = noiseBuffer;
            whiteNoise.loop = true;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 300;

            windGain = audioCtx.createGain();
            windGain.gain.value = 0.03;

            whiteNoise.connect(filter);
            filter.connect(windGain);
            windGain.connect(audioCtx.destination);
            whiteNoise.start();
        }

        function playChime(freq = 523.25) {
            if (!audioCtx || !isAudioPlaying) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 1.5);
        }

        document.getElementById('soundToggle').addEventListener('click', () => {
            if (!audioCtx) initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            isAudioPlaying = !isAudioPlaying;
            document.getElementById('soundIcon').innerText = isAudioPlaying ? '🌙' : '🔇';
            document.getElementById('soundText').innerText = isAudioPlaying ? 'ปิดเสียงบรรยากาศ' : 'เปิดเสียงบรรยากาศ';
            if (windGain) windGain.gain.value = isAudioPlaying ? 0.04 : 0;
            if (isAudioPlaying) playChime(659.25);
        });

        // ==========================================
        // Canvas Rendering System
        // ==========================================
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let bgMode = "stars";
        const stars = Array.from({ length: 120 }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            size: Math.random() * 1.8 + 0.5,
            alpha: Math.random(),
            speed: Math.random() * 0.02 + 0.005
        }));

        const meteors = [];
        function addMeteor() {
            if (meteors.length < 4) {
                meteors.push({
                    x: Math.random() * width * 1.2 - width * 0.2,
                    y: Math.random() * height * 0.3,
                    len: Math.random() * 80 + 50,
                    speed: Math.random() * 6 + 4,
                    alpha: 1
                });
            }
        }
        setInterval(addMeteor, 2500);

        const hearts = [];
        const petals = [];

        function animate() {
            ctx.clearRect(0, 0, width, height);

            // Stars Background
            stars.forEach(s => {
                s.alpha += s.speed;
                if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(s.alpha)})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Meteors
            meteors.forEach((m, idx) => {
                m.x += m.speed;
                m.y += m.speed * 0.6;
                m.alpha -= 0.01;
                ctx.strokeStyle = `rgba(255, 255, 255, ${m.alpha})`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(m.x, m.y);
                ctx.lineTo(m.x - m.len, m.y - m.len * 0.6);
                ctx.stroke();
                if (m.alpha <= 0) meteors.splice(idx, 1);
            });

            // Sea Reflection Effect (Chapter 2)
            if (bgMode === "sea") {
                ctx.fillStyle = "rgba(15, 23, 42, 0.4)";
                ctx.fillRect(0, height * 0.65, width, height * 0.35);
                ctx.strokeStyle = "rgba(254, 240, 138, 0.15)";
                ctx.lineWidth = 1;
                for (let i = 0; i < 8; i++) {
                    ctx.beginPath();
                    let y = height * 0.7 + i * 15;
                    ctx.moveTo(0, y + Math.sin(Date.now() * 0.002 + i) * 3);
                    ctx.lineTo(width, y + Math.cos(Date.now() * 0.002 + i) * 3);
                    ctx.stroke();
                }
            }

            // Hearts Floating Effect (Chapter 3)
            if (bgMode === "hearts") {
                if (Math.random() < 0.05) {
                    hearts.push({ x: Math.random() * width, y: height + 20, size: Math.random() * 12 + 8, speed: Math.random() * 1.5 + 0.8, alpha: 1 });
                }
                hearts.forEach((h, i) => {
                    h.y -= h.speed;
                    h.alpha -= 0.003;
                    ctx.fillStyle = `rgba(244, 114, 182, ${h.alpha})`;
                    ctx.font = `${h.size}px sans-serif`;
                    ctx.fillText('❤️', h.x, h.y);
                    if (h.alpha <= 0) hearts.splice(i, 1);
                });
            }

            // Rose Petals Wind Effect (Chapter 4)
            if (bgMode === "petals") {
                if (Math.random() < 0.08) {
                    petals.push({ x: -20, y: Math.random() * height, size: Math.random() * 8 + 6, speedX: Math.random() * 2 + 1.5, speedY: Math.random() * 1 - 0.5, rot: Math.random() * 360 });
                }
                petals.forEach((p, i) => {
                    p.x += p.speedX;
                    p.y += p.speedY;
                    p.rot += 1;
                    ctx.fillStyle = `rgba(244, 63, 94, 0.6)`;
                    ctx.beginPath();
                    ctx.ellipse(p.x, p.y, p.size, p.size / 2, (p.rot * Math.PI) / 180, 0, Math.PI * 2);
                    ctx.fill();
                    if (p.x > width + 20) petals.splice(i, 1);
                });
            }

            requestAnimationFrame(animate);
        }
        animate();

        // ==========================================
        // Typewriter & Controller System
        // ==========================================
        function typeWriter(elementId, text, speed = 40, callback) {
            const el = document.getElementById(elementId);
            el.innerText = '';
            let i = 0;
            function type() {
                if (i < text.length) {
                    el.innerText += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else if (callback) {
                    callback();
                }
            }
            type();
        }

        function showScene(sceneId) {
            document.querySelectorAll('.scene').forEach(s => s.classList.add('hidden'));
            const target = document.getElementById(sceneId);
            target.classList.remove('hidden');
            target.classList.add('fade-enter-active');
        }

        // Opening Init
        setTimeout(() => {
            typeWriter('typewriter-opening', 'เว็บนี้...\nฟลุ๊คตั้งใจทำขึ้นมา\nเพื่อพี่คนเดียว', 50, () => {
                document.getElementById('startBtnWrapper').classList.remove('opacity-0');
            });
        }, 1000);

        // Moon Secret Easter Egg
        document.getElementById('moonContainer').addEventListener('click', () => {
            moonClicks++;
            playChime(400 + moonClicks * 50);
            if (moonClicks >= 3) document.getElementById('clickHint').classList.remove('opacity-0');
            if (moonClicks === 7) {
                document.getElementById('secretBox').classList.remove('hidden');
                document.getElementById('clickHint').innerText = "ปลดล็อกความลับแล้ว! ✨";
                playChime(880);
            }
        });

        // Start Journey
        document.getElementById('startBtn').addEventListener('click', () => {
            playChime(523.25);
            showScene('scene-story');
            loadChapter(0);
        });

        function loadChapter(index) {
            currentChapter = index;
            const ch = chapters[index];
            bgMode = ch.bgMode;

            document.getElementById('chapterBadge').innerText = ch.badge;
            document.getElementById('nextBtn').classList.add('hidden');

            typeWriter('typewriter-story', ch.text, 45, () => {
                document.getElementById('nextBtn').classList.remove('hidden');
            });
        }

        document.getElementById('nextBtn').addEventListener('click', () => {
            playChime(587.33);
            if (currentChapter < chapters.length - 1) {
                loadChapter(currentChapter + 1);
            } else {
                showFinalScene();
            }
        });

        function showFinalScene() {
            bgMode = "meteors";
            showScene('scene-final');
            setTimeout(() => {
                document.getElementById('finalQuestion').classList.remove('opacity-0');
                setTimeout(() => {
                    document.getElementById('choiceBtns').classList.remove('opacity-0');
                }, 1000);
            }, 800);
        }

        // Handle Yes Button
        document.getElementById('yesBtn').addEventListener('click', () => {
            playChime(880);
            sendTelegramNotification("💖 ได้สิ"); // ส่งแจ้งเตือนทันที

            confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
            showScene('scene-result');

            const resText = "ขอบคุณนะ ❤️\nฟลุ๊คสัญญาว่าจะดูแลความรู้สึกของพี่แพรวให้ดีที่สุด\nและจะทำให้ทุกวันที่เราอยู่ด้วยกันมีรอยยิ้ม\nสัญญาว่าจะทำตัวเองให้ดีขึ้นเพื่อพี่แพรว 😊";
            typeWriter('typewriter-result', resText, 40, () => {
                document.getElementById('afterResultBtns').classList.remove('opacity-0');
            });
        });

        // Handle No/Think Button
        document.getElementById('noBtn').addEventListener('click', () => {
            playChime(349.23);
            sendTelegramNotification("🤍 ขอคิดดูก่อน"); // ส่งแจ้งเตือนทันที

            showScene('scene-result');
            const resText = "ไม่เป็นไรเลย 😊\nฟลุ๊คเข้าใจ เรื่องแบบนี้ต้องใช้เวลา\nไม่ว่าคำตอบสุดท้ายจะเป็นแบบไหน\nฟลุ๊คก็เคารพการตัดสินใจของพี่เสมอ\n\nขอบคุณที่อ่านมาจนถึงตรงนี้\nสำหรับฟลุ๊ค แค่นี้ก็มีความหมายมากแล้ว ❤️";
            typeWriter('typewriter-result', resText, 40, () => {
                document.getElementById('afterResultBtns').classList.remove('opacity-0');
            });
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            playChime(523.25);
            showScene('scene-story');
            loadChapter(0);
        });
    </script>
</body>
